name: Build Android APK Online

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Find Gradle Wrapper
        id: locate
        run: |
          echo "=== Scanning repository files ==="
          find . -maxdepth 3 -not -path '*/.*'
          
          GRADLEW_FILE=$(find . -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW_FILE" ]; then
            echo "::error::gradlew file not found in repository. Generating a fresh wrapper..."
            gradle wrapper
            echo "dir=." >> $GITHUB_OUTPUT
          else
            GRADLEW_DIR=$(dirname "$GRADLEW_FILE")
            echo "Found gradlew in: $GRADLEW_DIR"
            echo "dir=$GRADLEW_DIR" >> $GITHUB_OUTPUT
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK & CMake
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Grant Execute Permission
        run: chmod +x ${{ steps.locate.outputs.dir }}/gradlew

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: HackersKeyboard-App
          path: '**/build/outputs/apk/debug/*.apk'
