name: Build Android APK Online

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Locate Project Root
        id: find_dir
        run: |
          if [ -f "gradlew" ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          elif [ -f "hackerskeyboard-master/gradlew" ]; then
            echo "dir=hackerskeyboard-master" >> $GITHUB_OUTPUT
          else
            GRADLEW_PATH=$(find . -name gradlew | head -n 1)
            echo "dir=$(dirname "$GRADLEW_PATH")" >> $GITHUB_OUTPUT
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK & CMake
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Grant Execute Permission to Gradle
        run: chmod +x ${{ steps.find_dir.outputs.dir }}/gradlew

      - name: Build Debug APK
        working-directory: ${{ steps.find_dir.outputs.dir }}
        run: ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: HackersKeyboard-App
          path: '**/build/outputs/apk/debug/*.apk'
