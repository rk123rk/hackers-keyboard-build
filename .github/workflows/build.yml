name: Build Android APK Online

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Locate Project Root & Restore Wrapper
        id: locate
        run: |
          GRADLEW_FILE=$(find . -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW_FILE" ]; then
            ROOT_DIR="."
          else
            ROOT_DIR=$(dirname "$GRADLEW_FILE")
          fi
          echo "dir=$ROOT_DIR" >> $GITHUB_OUTPUT

          # Ensure gradle-wrapper.jar exists
          mkdir -p "$ROOT_DIR/gradle/wrapper"
          if [ ! -f "$ROOT_DIR/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Downloading missing gradle-wrapper.jar..."
            curl -sLo "$ROOT_DIR/gradle/wrapper/gradle-wrapper.jar" https://raw.githubusercontent.com/gradle/gradle/v8.2.1/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK & CMake
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Grant Execute Permission
        run: chmod +x ${{ steps.locate.outputs.dir }}/gradlew

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: HackersKeyboard-App
          path: '**/build/outputs/apk/debug/*.apk'
